<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media Strategist</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --panel-alt: #eef3ff;
        --primary: #1d4ed8;
        --primary-dark: #173ea8;
        --user: #dbeafe;
        --assistant: #f3f4f6;
        --text: #111827;
        --muted: #6b7280;
        --border: #dbe1ea;
        --shadow: rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .app {
        max-width: 900px;
        margin: 32px auto;
        padding: 0 16px 40px;
      }

      .chat-shell {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 10px 30px var(--shadow);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        padding: 20px 22px 16px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2rem);
      }

      .disclaimer {
        margin-top: 8px;
        font-size: 0.82rem;
        opacity: 0.92;
      }

      .messages {
        height: 60vh;
        min-height: 420px;
        overflow-y: auto;
        padding: 18px 18px 10px;
        background: #f8fafc;
      }

      .message-row {
        display: flex;
        margin-bottom: 14px;
      }

      .message-row.user { justify-content: flex-end; }

      .message-row.assistant { justify-content: flex-start; }

      .bubble {
        max-width: 72%;
        padding: 12px 14px;
        border-radius: 16px;
        white-space: normal;
        line-height: 1.6;
        word-wrap: break-word;
      }

      .bubble p {
        margin: 0 0 8px;
      }

      .bubble p:last-child {
        margin-bottom: 0;
      }

      .bubble ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }

      .bubble li + li {
        margin-top: 6px;
      }

      .message-row.user .bubble {
        background: var(--user);
        border-bottom-right-radius: 6px;
      }

      .message-row.assistant .bubble {
        background: var(--assistant);
        border-bottom-left-radius: 6px;
      }

      .meta {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.8;
        margin-bottom: 4px;
      }

      .composer {
        display: flex;
        gap: 12px;
        padding: 16px 18px 18px;
        background: var(--panel);
        border-top: 1px solid var(--border);
      }

      textarea {
        flex: 1;
        min-height: 48px;
        max-height: 160px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
        color: var(--text);
        background: white;
      }

      textarea:focus {
        outline: 2px solid rgba(29, 78, 216, 0.2);
        border-color: var(--primary);
      }

      button {
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        padding: 0 18px;
        min-width: 100px;
        cursor: pointer;
      }

      button:hover {
        background: var(--primary-dark);
      }

      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .thinking {
        font-style: italic;
        color: var(--muted);
      }

      @media (max-width: 640px) {
        .bubble {
          max-width: 85%;
        }

        .composer {
          flex-direction: column;
        }

        button {
          width: 100%;
          min-height: 48px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="chat-shell">
        <div class="header">
          <h1>Social Media Strategist</h1>
          <div class="disclaimer">
            General strategy guidance — not a guarantee of results; platform algorithms and audiences vary.
          </div>
        </div>

        <div id="messages" class="messages" aria-live="polite"></div>

        <div class="composer">
          <textarea id="input" rows="1" placeholder="Ask about content ideas, hooks, captions, posting cadence, or engagement strategy..."></textarea>
          <button id="sendBtn" type="button">Send</button>
        </div>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('input');
      const sendBtn = document.getElementById('sendBtn');

      const conversation = [];

      function escapeHtml(value) {
        return value
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatReply(text) {
        const paragraphs = text.split(/\n\s*\n/).map((block) => block.trim()).filter(Boolean);

        if (!paragraphs.length) return '';

        return paragraphs
          .map((block) => {
            const lines = block.split('\n').map((line) => line.trim()).filter(Boolean);
            const bulletLines = lines.filter((line) => /^[-*•]\s+/.test(line));

            if (bulletLines.length === lines.length) {
              return '<ul>' + bulletLines.map((line) => '<li>' + escapeHtml(line.replace(/^[-*•]\s+/, '')) + '</li>').join('') + '</ul>';
            }

            return '<p>' + escapeHtml(block).replace(/\n/g, '<br>') + '</p>';
          })
          .join('');
      }

      function addMessage(role, text) {
        const row = document.createElement('div');
        row.className = `message-row ${role}`;

        const bubbleWrap = document.createElement('div');
        bubbleWrap.className = 'bubble';

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = role === 'user' ? 'You' : 'Strategy Assistant';

        const content = document.createElement('div');
        content.innerHTML = formatReply(text);

        bubbleWrap.appendChild(meta);
        bubbleWrap.appendChild(content);
        row.appendChild(bubbleWrap);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function setThinking(isThinking) {
        const existing = document.getElementById('thinking-indicator');
        if (existing) existing.remove();

        if (!isThinking) return;

        const row = document.createElement('div');
        row.id = 'thinking-indicator';
        row.className = 'message-row assistant';

        const bubble = document.createElement('div');
        bubble.className = 'bubble thinking';
        bubble.textContent = 'Thinking...';

        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        conversation.push({ role: 'user', content: text });
        addMessage('user', text);
        inputEl.value = '';
        inputEl.focus();
        setThinking(true);
        sendBtn.disabled = true;

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: conversation })
          });

          const data = await response.json();
          const reply = data.reply || data.detail || 'Sorry, I could not generate a response.';

          if (response.ok) {
            conversation.push({ role: 'assistant', content: reply });
            addMessage('assistant', reply);
          } else {
            addMessage('assistant', reply);
          }
        } catch (error) {
          addMessage('assistant', "Sorry, I'm having trouble answering right now...");
        } finally {
          setThinking(false);
          sendBtn.disabled = false;
        }
      }

      sendBtn.addEventListener('click', sendMessage);

      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      addMessage('assistant', 'Hi! I can help you plan content, hooks, captions, posting cadence, hashtags, and audience growth. What are you trying to grow?');
    </script>
  </body>
</html>
